site_name: 知识 Wiki
site_description: 个人知识库与技术文档中心，覆盖 AUTOSAR、嵌入式、编程、人工智能与计算机科学
site_url: https://www.likui.info/wiki/site
repo_url: https://github.com/ilikui/wiki
repo_name: ilikui/wiki
edit_uri: edit/master/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  font:
    text: Roboto
    code: Roboto Mono

nav:
    - 主页: index.md
    - 开始: getting-started.md
    - 用户手册: 
        - Install: user-guide/installation.md
        - Theme: user-guide/choosing-your-theme.md
        - Customizing: user-guide/customizing-your-theme.md
        - Localizing: user-guide/localizing-your-theme.md
        - Configuration: user-guide/configuration.md
        - Cli: user-guide/cli.md
        - Deploying: user-guide/deploying-your-docs.md
        - Writing: user-guide/writing-your-docs.md
        - README: user-guide/README.md
    - 开发指南: 
        - API: dev-guide/api.md
        - Plugins: dev-guide/plugins.md
        - Themes: dev-guide/themes.md
        - Translations: dev-guide/translations.md
        - README: dev-guide/README.md
    - 1000 问知识体系:
        - 总目录: 1000-questions/README.md
        - AUTOSAR: 1000-questions/autosar/README.md
        - 嵌入式: 1000-questions/embedded/README.md
        - C 语言: 1000-questions/c-language/README.md
        - AI 与大模型: 1000-questions/ai/README.md
        - 考研数学: 1000-questions/math/README.md
        - 概率论与数理统计: 1000-questions/probability/README.md
        - 软考与系统架构: 1000-questions/soft-exam/README.md
        - 历史: 1000-questions/history/README.md
        - 儿童教育: 1000-questions/child-education/README.md
        - MATLAB / Simulink: 1000-questions/matlab/README.md
        - 电气工程: 1000-questions/electrical/README.md
        - 电气工程学习入口: 1000-questions/electrical-overview/README.md
    - PPT:
        - ppt: ppt/matlab.md
    - CS:
        - 目录: cs/目录.md
        - 必学工具: cs/必学工具.md
        - 好书推荐: cs/好书推荐.md
        - 数学基础: cs/数学基础.md
        - 数学进阶: cs/数学进阶.md
        - 编程入门: cs/编程入门.md
        - 电子基础: cs/电子基础.md
        - 数据结构与算法: cs/数据结构与算法.md
        - 软件工程: cs/软件工程.md
        - 体系结构: cs/体系结构.md
        - 操作系统: cs/操作系统.md
        - 并行与分布式系统: cs/并行与分布式系统.md
        - 计算机系统安全: cs/计算机系统安全.md
        - 计算机网络: cs/计算机网络.md
        - 数据库系统: cs/数据库系统.md
        - 编译原理: cs/编译原理.md
        - 计算机图形学: cs/计算机图形学.md
        - Web开发: cs/Web开发.md
        - 数据科学: cs/数据科学.md
        - 人工智能: cs/人工智能.md
        - 机器学习: cs/机器学习.md
        - 机器学习系统: cs/机器学习系统.md
        - 深度学习: cs/深度学习.md
        - 机器学习进阶: cs/机器学习进阶.md
    - 阅读:
        - Reading: read/Reading.md
        - Books: read/Books.md
    - 关于:
        - About: about/about.md
       
extra_css:
    - css/extra.css

extra_javascript: []
markdown_extensions:
  - toc:
      permalink: true
  - attr_list
  - def_list
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - mdx_gh_links:
      user: ilikui
      repo: wiki
  - mkdocs-click
plugins:
  - search
  - rss:
      date_from_meta:
        as_creation: "date"
        datetime_format: "%Y-%m-%d %H:%M"
        default_timezone: "Europe/Paris"
        default_time: "22:00"
        abstract_chars_count: 160
        abstract_delimiter: <!-- more -->
        image: https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Feed-icon.svg/128px-Feed-icon.svg.png
        match_path: ".*"
        pretty_print: false
      url_parameters:
        utm_source: "documentation"
        utm_medium: "RSS"
        utm_campaign: "feed-syndication"
  - blogging:
      dirs: # The directories to be included
        - blog
  - mermaid2:
  - build_plantuml:
      render: "server"
      bin_path: "/usr/local/bin/plantuml"
      server: "http://www.plantuml.com/plantuml"
      output_format: "svg"
      diagram_root: "docs/diagrams"
      output_folder: "out"
      input_folder: "src"
      theme_enabled: true
      theme_folder: "include/themes"
      theme_light: "light.puml"
      theme_dark: "dark.puml"
