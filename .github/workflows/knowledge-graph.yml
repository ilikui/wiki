name: Generate document knowledge graph

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/knowledge-graph.md"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: knowledge-graph
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate graph from Markdown documents
        run: python scripts/generate_knowledge_graph.py
      - name: Commit generated graph when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/knowledge-graph.md docs/knowledge-graph.json
          if git diff --cached --quiet; then
            echo "Knowledge graph is already up to date."
            exit 0
          fi
          git commit -m "docs: update generated knowledge graph"
          git push origin HEAD:master
